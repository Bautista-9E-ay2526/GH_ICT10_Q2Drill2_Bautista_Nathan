<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <title>Q2-Drill2</title>

    <!-- Internal Style Sheet (Dark Theme) -->
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-custom {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            padding: 24px;
            border: 1px solid #2d2d2d;
        }

        h2 {
            color: #ffffff;
            font-weight: 600;
        }

        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #2a2a2a;
            border-color: #0d6efd;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .form-control::placeholder {
            color: #aaaaaa;
        }

        #output {
            background-color: #25282c;
            border-left: 4px solid #0d6efd;
            font-size: 0.95rem;
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card-custom">
            <h2 class="mb-3">Add new club member:</h2>
            <form class="mb-3">
                <div class="mb-2">
                    <input type="text" id="firstname" class="form-control" placeholder="Enter the first name">
                </div>
                <div class="mb-2">
                    <input type="text" id="lastname" class="form-control" placeholder="Enter the last name">
                </div>
                <button type="button" py-click="checkresult" class="btn btn-primary w-100 mt-2">Submit</button>
            </form>
            <div id="output" class="p-3 rounded"></div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
